name: ProofQA — browser QA checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: proofqa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ProofQA and Chromium
        run: |
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Verify CLI
        run: |
          proofqa --help
          proofqa --version
      - name: Lint
        run: ruff check .
      - name: Unit and real Chromium integration tests
        env:
          PQL_QA_BROWSER_TEST: "1"
        run: pytest -q tests
      - name: Scan synthetic localhost fixture
        run: |
          python -m http.server 8899 --bind 127.0.0.1 --directory examples/sample-site >/tmp/proofqa-site.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8899/ >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          proofqa --url http://127.0.0.1:8899 --authorized --path / --path /about.html --output proofqa-ci-results
          python -c "import json; from pathlib import Path; p=Path('proofqa-ci-results'); r=json.loads((p/'report.json').read_text()); assert r['pages']==['/','/about.html']; assert len(r['screenshots'])==4; assert r['counts']['FAIL']==0 and r['counts']['BLOCKED']==0; assert (p/'report.html').exists() and (p/'report.md').exists()"
      - name: Upload synthetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofqa-synthetic-evidence
          path: proofqa-ci-results/
          if-no-files-found: warn

  release:
    name: Publish v0.2.0 after passing CI
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.2.0 tag and GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.0 already published; skipping.'
            exit 0
          fi
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'ProofQA v0.2.0 — Local Developer Preview' \
            --notes-file docs/RELEASE_NOTES.md
